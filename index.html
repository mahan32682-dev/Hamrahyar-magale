<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#16204a;--mut:#5d6a8c;--line:#d9e1ee;--lap:#243b8a;--lap2:#16204a;--tur:#1fb5ad;--saf:#f2a93b;--anr:#d64a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1230;--card:#161d44;--tx:#eaf0ff;--mut:#9aa7d0;--line:#2a346b}}
:root[data-theme="dark"]{--bg:#0d1230;--card:#161d44;--tx:#eaf0ff;--mut:#9aa7d0;--line:#2a346b}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.8 'Vazirmatn',Tahoma,sans-serif}
.w{max-width:880px;margin:auto;padding:12px 14px 40px}
.hd{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,var(--lap2),var(--lap));color:#fff;padding:20px 20px 16px}
.hd svg.pt{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.hr{position:relative;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hr .tt{flex:1;min-width:200px}
.hr h1{margin:0;font-size:22px;font-weight:800}
.hr p{margin:2px 0 8px;color:#c9d6ff;font-size:13px}
.nm{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:8px 12px;font:inherit}
.nm::placeholder{color:#b9c7f5}
.ring{position:relative;width:96px;height:96px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.lv{display:inline-block;margin-top:6px;background:var(--saf);color:#3b2600;border-radius:99px;padding:0 12px;font-size:12px;font-weight:600;text-align:center}
.jr{position:relative;display:flex;justify-content:space-between;margin-top:18px;padding:0 4px}
.jr:before,.jr i{content:"";position:absolute;top:19px;right:24px;left:24px;height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
.jr i{left:auto;width:0;background:linear-gradient(270deg,var(--saf),var(--tur));transition:width .6s}
.st{position:relative;z-index:1;border:0;background:none;color:#fff;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:52px}
.st span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#2b3f8f;border:2px solid rgba(255,255,255,.35);transition:.25s}
.st.dn span{background:var(--tur);border-color:#fff}
.st.on span{background:var(--saf);border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 5px rgba(242,169,59,.3)}
.st:focus-visible{outline:2px solid var(--saf);outline-offset:3px;border-radius:10px}
.pn{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.bn{padding:16px 18px;color:#fff;display:flex;gap:12px;align-items:center}
.bn em{font-style:normal;font-size:34px}
.bn h2{margin:0;font-size:19px;font-weight:800}
.bn p{margin:0;font-size:13px;opacity:.92}
.bd{padding:16px 18px}
.tip{background:color-mix(in srgb,var(--saf) 18%,transparent);border-right:4px solid var(--saf);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.fl{margin-bottom:14px}
.fl label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
textarea{width:100%;background:var(--bg);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--tur)}
h3{margin:18px 0 6px;font-size:15px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer}
.ck input{position:absolute;opacity:0}
.bx{flex:none;width:22px;height:22px;margin-top:3px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;color:#fff;font-size:14px;transition:.2s}
.ck input:checked+.bx{background:var(--tur);border-color:var(--tur)}
.ck input:checked+.bx:after{content:"✓"}
.ck input:checked~span:last-child{opacity:.6;text-decoration:line-through}
.ck input:focus-visible+.bx{outline:2px solid var(--saf);outline-offset:2px}
.nv{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.bt{border:0;border-radius:12px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--lap);color:#fff}
.bt.g{background:transparent;color:var(--tx);border:1.5px solid var(--line)}
.bt.s{background:var(--saf);color:#3b2600}
.bt:disabled{opacity:.35;cursor:default}
.tl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tl .bt{font-size:12px;padding:6px 12px}
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.sm div{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:12px}
.sm b{display:block;font-size:17px}
